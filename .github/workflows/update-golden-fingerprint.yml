name: Update schema golden fingerprint

# Manual only (workflow_dispatch). Replays migrations 000-039 on a disposable
# local Supabase stack, generates a new schema_fingerprint.golden.json, verifies
# it passes the contract check, and commits it back to the triggering branch.
#
# - Uses no hosted Supabase credentials and no production access.
# - Runs entirely on a GitHub-hosted runner (Docker is available on ubuntu-latest).
# - Requires contents:write permission to commit the updated golden back.
# - Never writes to any other file in the repository.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_MIGRATIONS: "40"
  LAST_MIGRATION: "039"

jobs:
  update-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Verify migration count and required files
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $1" >&2; exit 1; }
          mapfile -t MIG < <(ls supabase/migrations | grep -E '^[0-9]{3}_.*\.sql$' | sort)
          [ "${#MIG[@]}" -eq "$EXPECTED_MIGRATIONS" ] || fail "expected $EXPECTED_MIGRATIONS migrations, found ${#MIG[@]}"
          i=0
          for f in "${MIG[@]}"; do
            v=$((10#${f%%_*}))
            [ "$v" -eq "$i" ] || fail "migration gap or duplicate at $(printf '%03d' "$i") (found $f)"
            i=$((i + 1))
          done
          [ "${MIG[-1]%%_*}" = "$LAST_MIGRATION" ] || fail "last migration is ${MIG[-1]}, expected $LAST_MIGRATION"
          echo "PASS: $EXPECTED_MIGRATIONS migrations present, contiguous 000-$LAST_MIGRATION"
          for f in \
            supabase/verification/schema_fingerprint.sql \
            supabase/verification/schema_contract.json \
            supabase/verification/check_schema_contract.mjs \
            supabase/config.toml; do
            [ -f "$f" ] || fail "required file missing: $f"
          done
          echo "PASS: required files present"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Point the local stack at a per-run disposable project
        run: |
          set -euo pipefail
          ID="update-golden-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed -i -E "s/^project_id = \".*\"/project_id = \"$ID\"/" supabase/config.toml
          grep -E '^project_id' supabase/config.toml
          echo "DISPOSABLE_ID=$ID" >> "$GITHUB_ENV"

      - name: Start local Supabase stack
        run: |
          set +e
          npx supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -viE 'key|secret|token|jwt|password' "$RUNNER_TEMP/supabase-start.log" || true
            exit "$rc"
          fi
          echo "Local stack started"

      - name: Replay all migrations 000-${{ env.LAST_MIGRATION }}
        run: |
          set -euo pipefail
          C="supabase_db_${DISPOSABLE_ID}"
          npx supabase db reset --local
          row="$(docker exec -i "$C" psql -U postgres -d postgres -X -At -c \
            "select count(*), max(version) from supabase_migrations.schema_migrations")"
          [ "$row" = "${EXPECTED_MIGRATIONS}|${LAST_MIGRATION}" ] \
            || { echo "FAIL: ledger after replay is '$row', expected ${EXPECTED_MIGRATIONS}|${LAST_MIGRATION}" >&2; exit 1; }
          echo "PASS: ledger $row"
          echo "DB_CONTAINER=$C" >> "$GITHUB_ENV"

      - name: Generate new golden fingerprint
        run: |
          set -euo pipefail
          # Use postgres user so pg_get_expr renders auth.uid() (not uid()) in policy USING clauses.
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -X -q -At \
            < supabase/verification/schema_fingerprint.sql \
            > supabase/verification/schema_fingerprint.golden.json
          test -s supabase/verification/schema_fingerprint.golden.json \
            || { echo "FAIL: fingerprint produced no output" >&2; exit 1; }
          # Validate it is valid JSON.
          node -e "JSON.parse(require('fs').readFileSync('supabase/verification/schema_fingerprint.golden.json', 'utf8'))" \
            || { echo "FAIL: fingerprint is not valid JSON" >&2; exit 1; }
          echo "Golden fingerprint written ($(wc -c < supabase/verification/schema_fingerprint.golden.json) bytes)"

      - name: Verify new golden passes contract check
        run: |
          set -euo pipefail
          node supabase/verification/check_schema_contract.mjs \
            supabase/verification/schema_fingerprint.golden.json
          echo "PASS: contract check passed against new golden"

      - name: Second independent replay — must be byte-identical
        run: |
          set -euo pipefail
          npx supabase db reset --local
          row="$(docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -X -At -c \
            "select count(*), max(version) from supabase_migrations.schema_migrations")"
          [ "$row" = "${EXPECTED_MIGRATIONS}|${LAST_MIGRATION}" ] \
            || { echo "FAIL: second replay ledger is '$row'" >&2; exit 1; }
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -X -q -At \
            < supabase/verification/schema_fingerprint.sql \
            > "$RUNNER_TEMP/fp2.json"
          node -e "
            const g = require('fs').readFileSync('supabase/verification/schema_fingerprint.golden.json', 'utf8');
            const r2 = require('fs').readFileSync(process.argv[1], 'utf8');
            if (g !== r2) { console.error('FAIL: two replays differ — golden is not deterministic'); process.exit(1); }
            console.log('PASS: second replay is byte-identical to the golden');
          " "$RUNNER_TEMP/fp2.json"

      - name: Commit and push updated golden
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/verification/schema_fingerprint.golden.json
          if git diff --cached --quiet; then
            echo "Golden fingerprint is already up to date — no commit needed"
          else
            git commit -m "ci: regenerate schema golden fingerprint for migration 039 (two replays byte-identical, contract passes)"
            git push
            echo "PASS: updated golden committed and pushed"
          fi

      - name: Stop local stack
        if: always()
        run: npx supabase stop --no-backup
