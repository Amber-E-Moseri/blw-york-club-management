name: PostgreSQL 17 candidate fingerprint 000-105 (review only)

# Manual only. Certifies one explicitly selected integration commit on the Supabase PostgreSQL 17 image
# (supabase/config.toml pins major_version = 17) by replaying the complete migration chain 000-105 on a fresh
# disposable local stack. It writes a CANDIDATE schema fingerprint. It never reads or writes the authoritative golden
# fingerprint, never touches a hosted project, and never asserts equivalence to the golden. A reviewer compares the
# uploaded candidate to the golden and approves any golden change separately.
#
# Selection. The workflow certifies only the commit named in candidate_sha. It fails unless HEAD of that commit is
# exactly candidate_sha and its supabase/migrations tree equals migrations_tree. Certification tooling (scripts/) is
# taken from the ref the workflow was dispatched from; the candidate's migrations, verification files and contract are
# not changed by that overlay.
#
# The 000-101 workflow (pg17-candidate-fingerprint.yml, scripts/certify-integrated-101.sh) is kept unchanged for
# historical verification.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Integration commit to certify (must equal the checked-out HEAD)"
        required: true
        type: string
      migrations_tree:
        description: "Git tree of supabase/migrations at candidate_sha (verified before replay)"
        required: true
        type: string
        default: "3edefbdd4395f937c1b4a0cb98e90c450d965e31"
      history_base:
        description: "Reviewed commit whose 000-103 migrations are the accepted history (must be available)"
        required: true
        type: string
        default: "2b2e88f285785ce794942cb43d2b95645d23ba36"

permissions:
  contents: read

jobs:
  pg17-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the selected integration commit (full history for the immutability check)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify the selected commit and migration tree
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_TREE: ${{ inputs.migrations_tree }}
          HISTORY_BASE: ${{ inputs.history_base }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          [ "$HEAD_SHA" = "$EXPECTED_SHA" ] || { echo "FAIL: checked out $HEAD_SHA, expected $EXPECTED_SHA"; exit 1; }
          TREE="$(git rev-parse "HEAD:supabase/migrations")"
          [ "$TREE" = "$EXPECTED_TREE" ] || { echo "FAIL: migrations tree $TREE, expected $EXPECTED_TREE"; exit 1; }
          git cat-file -e "${HISTORY_BASE}^{commit}" || { echo "FAIL: history base $HISTORY_BASE not available"; exit 1; }
          echo "verified candidate $HEAD_SHA with migrations tree $TREE; history base $HISTORY_BASE"

      - name: Overlay certification tooling from the dispatched ref (candidate migrations are not changed)
        env:
          TOOLING_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TOOLING_REF"
          git checkout FETCH_HEAD -- scripts
          git status --short -- supabase | tee /dev/stderr | (! grep .) || { echo "FAIL: overlay changed supabase/"; exit 1; }
          echo "tooling from $TOOLING_REF; candidate supabase/ unchanged"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Point the local stack at a per-run disposable project
        run: |
          ID="pg17cand-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed -i -E "s/^project_id = \".*\"/project_id = \"$ID\"/" supabase/config.toml
          grep -E '^(project_id|major_version)' supabase/config.toml
          echo "F2_DISPOSABLE_PROJECT_ID=$ID" >> "$GITHUB_ENV"

      - name: Target guard self-test
        run: bash scripts/test_f2_target_guard.sh

      - name: Start the disposable local stack (PostgreSQL 17)
        run: npx supabase start

      - name: Validate the chain and replay 000-105, then write the candidate fingerprint (no golden read or written)
        env:
          F2_DB_ADMIN: postgres
          F2_OUT_DIR: ${{ runner.temp }}
          F2_EXPECTED_SHA: ${{ inputs.candidate_sha }}
          F2_HISTORY_BASE: ${{ inputs.history_base }}
        run: scripts/certify-integrated-105.sh

      - name: Upload the candidate fingerprint for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg17-candidate-fingerprint-105-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/schema_fingerprint.candidate-105.json
            ${{ runner.temp }}/contract-check-105.txt
            ${{ runner.temp }}/membership-105.log
          if-no-files-found: error
          retention-days: 30

      - name: Stop the local stack
        if: always()
        run: npx supabase stop --no-backup
